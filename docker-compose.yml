services:
  app:
    build: .
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file: backend/.env
    # env_file beats the image's ENV, and backend/.env carries local paths for the non-Docker run
    # (DB_PATH=./app.db would put the database outside the volume). Compose gives these priority.
    environment:
      DATA_DIR: /app/data
      CONFIG_PATH: /app/config.yaml
      FRONTEND_DIST: /app/frontend/dist
      DB_PATH: /data/app.db
      UPLOAD_DIR: /data/uploads
      PORT: "8000"
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:
